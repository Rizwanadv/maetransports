<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="320" height="80">
  <!-- Background subtle shape -->
  <defs>
    <linearGradient id="truckGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1a365d"/>
      <stop offset="100%" style="stop-color:#0f172a"/>
    </linearGradient>
  </defs>
  <!-- Simplified truck silhouette -->
  <g transform="translate(8, 22)">
    <!-- Cab -->
    <rect x="0" y="12" width="28" height="22" rx="2" fill="#c53030"/>
    <rect x="4" y="6" width="18" height="10" rx="1" fill="#e2e8f0"/>
    <!-- Trailer -->
    <rect x="30" y="14" width="42" height="20" rx="1" fill="#1a365d"/>
    <!-- Wheels -->
    <circle cx="12" cy="36" r="6" fill="#0f172a" stroke="#94a3b8" stroke-width="1.5"/>
    <circle cx="12" cy="36" r="2.5" fill="#64748b"/>
    <circle cx="42" cy="36" r="6" fill="#0f172a" stroke="#94a3b8" stroke-width="1.5"/>
    <circle cx="42" cy="36" r="2.5" fill="#64748b"/>
    <circle cx="58" cy="36" r="6" fill="#0f172a" stroke="#94a3b8" stroke-width="1.5"/>
    <circle cx="58" cy="36" r="2.5" fill="#64748b"/>
  </g>
  <!-- Text -->
  <text x="90" y="38" font-family="Arial Black, Arial, sans-serif" font-size="26" font-weight="900" fill="#ffffff" letter-spacing="1">MAE</text>
  <text x="155" y="38" font-family="Arial Black, Arial, sans-serif" font-size="26" font-weight="900" fill="#c53030" letter-spacing="1">LEGACY</text>
  <text x="90" y="58" font-family="Arial, sans-serif" font-size="11" font-weight="600" fill="#94a3b8" letter-spacing="3">TRANSPORTS LLC</text>
</svg>
